<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking | Ernest-Shoot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
     
  <header>
    <div class="navbar">
      <div class="logo">Ernest<span>-Shoot</span></div>
      <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="gallery.html">Gallery</a>
        <a href="client-gallery.html">Client Gallery</a>
        <a href="booking.html" class="active">Booking</a>
      </nav>
    </div>
  </header>

  <section class="section">
    <h2>Fill out the form below to request your session.</h2>
    
    <form class="form-box"
      action="https://formspree.io/f/mpqeneve"
      method="POST">

      <label for="name">Full Name</label>
      <input type="text" id="name" name="Full Name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="Email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="Phone Number">

    
      <label for="package">Choose Package</label>
      <select id="package" name ="package" required>
        <option value="">Select package</option>
        <option>Indoor Portrait Session - $200</option>
        <option>Outdoor Portrait Session - $250</option>
        <option>Custom Session</option>
      </select>

      <label for="date">Preferred Date</label>
      <input type="date" id="date-picker" required>
      <input type="hidden" id="formatted-date" name="preferred Date">

      <div class="form-group">
        <label for="time">Preferred Time</label>

        <select id="time" name="Preferred Time" required>
          <option value="">Choose a time</option>
          <option value="10:00 AM">10:00 AM</option>
          <option value="11:30 AM">11:30 AM</option>
          <option value="1:00 PM">1:00 PM</option>
          <option value="2:30 PM">2:30 PM</option>
          <option value="3:30 PM">3:30 PM</option>
          <option value="4:30 PM">4:30 PM</option>
          <option value="4:30 PM">5:00 PM</option>
          <option value="4:30 PM">6:30 PM</option>
          <option value="4:30 PM">7:00 PM</option>
          <option value="4:30 PM">8:30 PM</option>
        </select>
      </div>


      <label for="message">Message</label>
      <textarea id="message" name="Message"placeholder="Tell me about your shoot idea..."></textarea>

      <br><br>
      <button class="btn" type="submit">Submit Booking Request</button>
      <p id="bookingStatus" style="margin-top: 15px;"></p>
    </form>
  </section>
   
  <footer>
    <p>&copy; 2026 Ernest-Shoot. All rights reserved.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
